<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="pwa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect width="512" height="512" rx="128" fill="url(#pwa-grad)" />
  
  <!-- Hierarchy Guide Tree & Checkmark Graphics -->
  <g filter="url(#pwa-shadow)">
    <!-- Branch Connector Dots -->
    <circle cx="120" cy="180" r="16" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="120" cy="256" r="16" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="120" cy="332" r="16" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Tree Branch Line -->
    <path d="M120 180 V332" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 16" stroke-opacity="0.6" />
    
    <!-- Hero Checkmark -->
    <path d="M190 260 L240 310 L370 180" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Subtask indicator ticks -->
    <path d="M250 380 L350 380" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>
